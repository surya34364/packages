[project]
name = "packaging"
version = "0.1.0"
description = "Monorepo containing utility packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
packaging = "packaging:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
packaging = "src/packaging"
package1 = "src/packaging/package1/src/package1"
package2 = "src/packaging/package2/src/package2"
package3 = "src/packaging/package3/src/package3"
package4 = "src/packaging/package4/src/package4"
package5 = "src/packaging/package5/src/package5"

[project]
name = "packaging"
version = "0.1.0"
description = "Utility packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
packaging = "packaging:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/packaging"]